<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout de Colunas - Cavaleiros do Zodíaco</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1>Aprendendo a criar Layout de Colunas</h1>

    </header>

    <main>
        <section class="container-principal">
            <div class="card-item vertical-inicio" style="grid-column: 1;">
                <img src="imagens/cav2.jpeg" alt="Ilustração dos doze Cavaleiros de Ouro de Os Cavaleiros do Zodíaco posando com suas armaduras douradas em frente ao zodíaco.">
            </div>
            <div class="card-item">
                <img src="imagens/cav1.jpeg" alt="Retrato de perfil dos cinco Cavaleiros de Bronze principais vestindo suas armaduras clássicas sob um céu estrelado.">
            </div>
            <div class="card-item">
                <img src="imagens/cav3.jpeg" alt="Grupo dos Cavaleiros de Ouro em posição de batalha com o Cavaleiro de Sagitário em destaque no centro.">
            </div>
            <div class="card-item">
                <img src="imagens/cav4.jpeg" alt="Os doze Cavaleiros de Ouro lado a lado com seus nomes identificados em uma sala com pilares gregos.">
            </div>
            <div class="card-item">
                <img src="imagens/cav5.jpeg" alt="Os cinco Cavaleiros de Bronze com suas armaduras evoluídas em uma floresta, com uma ave voando ao fundo.">
            </div>
            <div class="card-item">
                <img src="imagens/cav6.jpeg" alt="Ikki de Fênix em pose de ataque envolto em chamas intensas com uma fênix de fogo ao fundo.">
            </div>
            <div class="card-item">
                <img src="imagens/cav7.jpeg" alt="Atena segurando seu báculo dourado em frente a um templo grego clássico.">
            </div>
            <div class="card-item">
                <img src="imagens/cav8.jpeg" alt="Os cinco Cavaleiros de Bronze trajando suas respectivas Armaduras de Ouro, com Seiya vestindo a de Sagitário no centro.">
            </div>
            <div class="card-item">
                <img src="imagens/cav9.jpeg" alt="Atena ao centro, cercada pelos cinco Cavaleiros de Bronze em suas armaduras de bronze, contra um fundo cósmico.">
            </div>
            <div class="card-item">
                <img src="imagens/cav10.jpeg" alt="Seiya de Pégaso vestindo a Armadura de Ouro de Sagitário com asas abertas e brilho intenso.">
            </div>
            <div class="card-item">
                <img src="imagens/cav11.jpeg" alt="Os cinco Cavaleiros de Bronze principais unindo seus punhos em um gesto de camaradagem e união.">
            </div>
            <div class="card-item">
                <img src="imagens/cav12.jpeg" alt="Close-up de Shiryu de Dragão em sua armadura, com um olhar determinado e efeito de energia azul ao fundo.">
            </div>
            <div class="card-item">
                <img src="imagens/cav15.jpeg" alt="Ikki de Fênix em pose de ataque envolto em chamas intensas.">
            </div>
            <div class="card-item vertical-fim" style="grid-column: 4;">
                <img src="imagens/cav14.jpeg" alt="Paisagem noturna do Santuário, com templos gregos iluminados no topo de colinas sob um céu estrelado e lua cheia.">
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Meu Exercício Criando Layout de Colunas</p>

    </footer>
    
</body>
</html>
